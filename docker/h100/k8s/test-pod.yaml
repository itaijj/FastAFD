apiVersion: v1
kind: Pod
metadata:
  name: ${TEMPLATE_POD}
  labels:
    app: afd-recipe
    role: h100-test
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: ${TEMPLATE_FSGROUP}
  volumes:
    - name: work
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
    - name: entry
      configMap:
        name: ${TEMPLATE_POD}-entry
  initContainers:
    - name: clone
      image: docker.io/alpine/git:latest
      env:
        - {name: HOME, value: /work}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          git clone --depth 1 -b "${TEMPLATE_BRANCH}" "${TEMPLATE_REPO}" /work/FastAFD
          git -C /work/FastAFD rev-parse HEAD > /work/FastAFD/.commit
          cat /work/FastAFD/.commit
      volumeMounts:
        - {name: work, mountPath: /work}
    - name: fetch-uv
      image: docker.io/curlimages/curl:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          mkdir -p /work/bin
          curl -fsSL https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /work/bin --strip-components=1
          /work/bin/uv --version
      volumeMounts:
        - {name: work, mountPath: /work}
  containers:
    - name: test
      image: docker.io/nvidia/cuda:13.0.0-devel-ubuntu24.04
      command: ["/bin/bash", "/entry/pod_entry.sh"]
      resources:
        requests:
          nvidia.com/gpu: "1"
          cpu: "16"
          memory: 64Gi
        limits:
          nvidia.com/gpu: "1"
          cpu: "32"
          memory: 128Gi
      volumeMounts:
        - {name: work, mountPath: /work}
        - {name: dshm, mountPath: /dev/shm}
        - {name: entry, mountPath: /entry, readOnly: true}
