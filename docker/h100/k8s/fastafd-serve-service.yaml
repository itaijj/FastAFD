apiVersion: v1
kind: Service
metadata:
  name: fastafd-qwen30b-service
  labels:
    app: fastafd-serve
spec:
  type: NodePort
  selector:
    app: fastafd-serve
  ports:
    - name: http
      port: ${TEMPLATE_SERVE_PORT}
      targetPort: ${TEMPLATE_SERVE_PORT}
      # nodePort is omitted when TEMPLATE_NODE_PORT is empty so K8s auto-assigns
      # from the 30000-32767 range. Set NODE_PORT in deploy_serve.sh to pin it.
      ${TEMPLATE_NODE_PORT_LINE}
